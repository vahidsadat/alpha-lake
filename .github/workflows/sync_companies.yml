name: 'Sync SEC Companies'

on:
  schedule:
    - cron: "0 0 1 * *"
      timezone: "Europe/Berlin"
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.PG_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PG_PASSWORD }}
          POSTGRES_DB: alphalake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv sync --only-group ingestion --frozen
      - name: Sync SEC Companies
        env: 
          SEC_NAME: ${{ secrets.SEC_NAME }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_DB: alphalake
        run: |
          uv run --only-group ingestion --frozen python -m src.scripts.GetCompaniesName
          
