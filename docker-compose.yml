services:
  backend:
    build: 
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"] 
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
        ollama:
          condition: service_healthy
        ollama-pull:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
  
  frontend:
    build:
      context: . 
      dockerfile: frontend/alphalake/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
        backend:
          condition: service_healthy
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
     - "11435:11434"
    volumes:
     - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
        ollama:
          condition: service_healthy

    entrypoint: >
      sh -c "
      sleep 5 &&
      ollama pull qwen3:4b-instruct
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama:/root/.ollama
    restart: "no"

  postgres:
    image: postgres:17
    container_name: alphalake
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=alphalake
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  ollama: {}
  postgres: {}